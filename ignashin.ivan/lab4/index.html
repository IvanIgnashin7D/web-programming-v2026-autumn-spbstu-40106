<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Форма создания товара (публичный контракт CI: поля id, name, price, categories) -->
    <form data-testid="entity-form" class="entity-form">
      <div class="form-title">Добавить товар</div>
      <input type="text" name="id" placeholder="ID" />
      <input type="text" name="name" placeholder="Название" />
      <input type="text" name="price" placeholder="Цена" />
      <input
        type="text"
        name="categories"
        placeholder="Категории (через запятую)"
      />
      <button type="submit">Добавить товар</button>
    </form>

    <!-- Дополнительная форма для управления категориями (по ТЗ варианта 25) -->
    <form class="category-form">
      <div class="form-title">Добавить категорию к товару</div>
      <input type="text" name="productId" placeholder="ID товара" />
      <input type="text" name="category" placeholder="Название категории" />
      <button type="submit">Добавить категорию</button>
    </form>

    <div data-testid="entity-list"></div>

    <script type="module" src="main.js"></script>
  </body>
</html>
