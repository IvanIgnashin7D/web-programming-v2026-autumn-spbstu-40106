<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 4 - Вариант 25</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form data-testid="entity-form" id="product-form">
      <div class="form-title">Добавить товар</div>
      <input type="number" name="id" placeholder="ID (число)" required />
      <input type="text" name="name" placeholder="Название товара" required />
      <input type="number" name="price" placeholder="Цена" required />
      <button type="submit">Добавить товар</button>
    </form>

    <form id="category-form">
      <div class="form-title">Добавить категорию</div>
      <input type="number" name="productId" placeholder="ID товара" required />
      <input
        type="text"
        name="category"
        placeholder="Название категории"
        required
      />
      <button type="submit">Добавить категорию</button>
    </form>

    <div data-testid="entity-list"></div>

    <script type="module" src="main.js"></script>
  </body>
</html>
